# Render Blueprint — New → Blueprint → select this repository.
services:
  - type: web
    name: quantumshift
    runtime: docker
    plan: free
    healthCheckPath: /api/system/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DEFAULT_MODE
        value: demo
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        sync: false
